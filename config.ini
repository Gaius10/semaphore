[game]
mode=ai
tick_ms=200
record_dir=recordings

[human_player | ai_player]
car_spawn_probability_h=0.5
car_spawn_probability_v=0.5
road_length_h=10
road_length_v=10

[view]
view_width=21
view_height=21

[ai_player]
; agent: noop | fixed_toggle | linear_combination
agent=linear_combination

; fixed_toggle agent parameters
toggle_interval_ticks=10

; linear_combination agent parameters
binarization_method=threshold
threshold=0.5
; coeficients_v=0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5
; coeficients_h=0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5

coeficients_h=0.7922555897, 1.93353436, 1.938657639, 0.5437061442, 1.33501829, 0.4141806631, 0.6650566542, 1.318400922, 1.8061534, 1.204918247
coeficients_v=1.194494851, 1.13380144, 1.00433976, 0.9161803525, 1.08653371, 1.051113931, 1.236034002, 0.4175579668, 0.4410687802, 1.925590457

;

[training]
; Genetic algorithm that looks for the threshold and the coefficients of the linear_combination
; agent. It plays the same world as the human_player / ai_player sections (spawn probabilities and
; road lengths), with no view. Run it with mode=training.
population_size=50
generations=1000
; each candidate plays this many games of this many ticks; its fitness is the average of
; cars passed - crash_penalty * crashes
episodes_per_candidate=5
episode_ticks=1000
crash_penalty=5
; the best candidates are copied unchanged into the next generation
elite_count=5
; candidates drawn at random for each parent selection; the best one of them wins
tournament_size=5
; chance that each number of a child mutates, and the size of the mutation as a fraction of its range
mutation_rate=0.1
mutation_sigma=0.1
; coefficients are searched in [0, coeficient_max] and the threshold in [0, threshold_max]
coeficient_max=2
threshold_max=4
seed=1
; worker processes that play candidates at the same time
workers=10
; the champion of every generation is saved in a new CSV file in this folder
training_output_dir=data
